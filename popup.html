<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exact URL Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="header-title">Exact URL Tracker</span>
    <span class="header-sub" id="activeCount">0 active</span>
  </div>

  <!-- Add URL Section -->
  <div class="add-section">
    <div class="add-row">
      <input
        class="input-url"
        id="urlInput"
        type="text"
        placeholder="https://github.com/codespaces/your-session-url"
        spellcheck="false"
        autocomplete="off"
      />
      <button class="btn-current" id="currentTabBtn" title="Use current active tab URL">⊕ Current</button>
      <button class="btn-add" id="addBtn">+ Add</button>
    </div>
    <div class="limit-row add-row">
      <span class="label-small">Monthly limit:</span>
      <input class="input-small" id="limitHours" type="number" min="0" step="0.5" placeholder="hrs" title="Hours">
      <input class="input-small" id="limitMins" type="number" min="0" max="59" step="1" placeholder="min" title="Minutes (optional)">
      <span class="label-small">Notify before:</span>
      <input class="input-small" id="notifyHours" type="number" min="0" step="0.5" placeholder="2" value="2" title="Notify X hours before limit">
      <span class="label-small">hrs</span>
    </div>
    <div class="toggle-row add-row">
      <label class="check-wrap">
        <input type="checkbox" id="autoCloseCheck">
        <span class="check-label">Auto-close tab on limit</span>
      </label>
    </div>
    <div class="error-text" id="errorText">Please enter a valid URL (must start with http:// or https://)</div>
  </div>

  <!-- Tracked Sites Label -->
  <div class="section-label" id="sectionLabel">TRACKED SITES</div>

  <!-- URL Cards List -->
  <div class="url-list" id="urlList">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">⏱</div>
      <div class="empty-text">No URLs tracked yet.<br>Add exact session URLs above.</div>
    </div>
  </div>

  <!-- Summary Bar -->
  <div class="summary-bar" id="summaryBar" style="display:none">
    <span class="summary-label">Total tracked this month</span>
    <span class="summary-val" id="totalMonth">0m</span>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-action" id="exportBtn">↑ Export JSON</button>
    <button class="btn-action" id="importBtn">↓ Import JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
